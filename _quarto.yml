project:
  type: book
  preview:
      port: 4200
filters:
  - include-code-files
book:
  title: "Kriptoloji Giris"
  author: "Atilla Özgür"
  date: today
  date-format: "YYYY-MM-DD"
  cover-image: cover.png

  chapters:
    - index.qmd
    - content/giris.qmd
    - content/random-numbers.qmd
    - content/simetrik-sifreler.qmd
#    - content/stream-cipher.qmd
    - content/hash-functions-tr.qmd
    - content/message-authentication-codes-tr.qmd
#    - summary.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - brand
  pdf:
    documentclass: scrreprt
    keep-tex: true
    papersize: a4
    geometry:
      - margin=2.5cm
    include-in-header:
      text: |
        \usepackage[export]{adjustbox}
        \AtBeginDocument{%
          \let\origincludegraphics\includegraphics
          \renewcommand{\includegraphics}[2][]{%
            \origincludegraphics[#1,max width=\linewidth,max totalheight=0.85\textheight]{#2}}%
        }

